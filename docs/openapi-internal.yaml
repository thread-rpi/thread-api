openapi: 3.0.4
info:
  title: Needle Thread API
  version: 1.0.0
  description: |
    OpenAPI specification for the Thread backend Flask service.

    Notes:
    - This spec documents the currently implemented endpoints in the project.
    - Some routes return non-2xx status codes for "not found" cases (as implemented).
servers:
  - url: http://localhost:5000
    description: Local development
tags:
  - name: System
  - name: Auth
  - name: Admin
  - name: Events
  - name: Images
  - name: Members
paths:
  /:
    get:
      tags: [System]
      summary: Service root
      description: Returns a plain text welcome message.
      operationId: getRoot
      responses:
        "200":
          description: Welcome text
          content:
            text/plain:
              schema:
                type: string
                example: Welcome to Needle!

  /health:
    get:
      tags: [System]
      summary: Health check
      description: Verifies API availability and MongoDB connectivity.
      operationId: getHealth
      responses:
        "200":
          description: Service and DB are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccessResponse"
        "500":
          description: DB connectivity or authentication issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with member credentials
      description: |
        Authenticates a member by email/password and returns JWT tokens.
        Access token expiry is configured in hours, refresh token expiry in weeks.
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"
        "401":
          description: Credentials invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Member is not authorized (not in admins collection)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Missing request fields or internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Requires a valid JWT refresh token and returns a new access token.
      operationId: postAuthRefresh
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSuccessResponse"
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated member profile
      description: Uses JWT identity (email) to fetch member details.
      operationId: getAuthMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated member data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeSuccessResponse"
        "500":
          description: Identity missing, user not found, or DB error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/images:
    get:
      tags: [Admin]
      summary: List and filter all images (admin)
      description: |
        Returns a paginated list of image documents from the images collection.
        Requires a valid JWT access token from an authorized admin.

        Query filters are combined with AND logic. By default, soft-deleted images
        (`deleted_at` set) are excluded unless `include_deleted=true`.

        Each image is serialized with an `id` field (string) instead of `_id`.
      operationId: getAdminImages
      security:
        - bearerAuth: []
      parameters:
        - name: published
          in: query
          schema:
            type: boolean
          description: Filter by published status.
        - name: event_id
          in: query
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Filter by parent event ObjectId.
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
          description: Include images on or after this ISO 8601 datetime.
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
          description: Include images on or before this ISO 8601 datetime.
        - name: include_deleted
          in: query
          schema:
            type: boolean
            default: false
          description: When true, include soft-deleted images.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of results to return.
        - name: skip
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip for pagination.
        - name: sort
          in: query
          schema:
            type: string
            default: "-date"
          description: Sort field; prefix with `-` for descending (default `-date`).
      responses:
        "200":
          description: Paginated images list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAdminImagesSuccessResponse"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database query failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{event_id}:
    get:
      tags: [Events]
      summary: Get event by id
      description: Returns a published event document for the provided id.
      operationId: getEventById
      parameters:
        - name: event_id
          in: path
          required: true
          description: MongoDB ObjectId for the event.
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEventSuccessResponse"
        "400":
          description: Invalid event_id format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database query failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/past:
    get:
      tags: [Events]
      summary: Get recent past events
      description: Returns up to 20 past published non-FOTW events sorted by date descending.
      operationId: getPastEvents
      responses:
        "200":
          description: Past events payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPastEventsSuccessResponse"
        "500":
          description: Retrieval failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/overview:
    get:
      tags: [Events]
      summary: Get event overview (past + upcoming)
      description: |
        Returns:
        - `past`: 3 most recent events up to now
        - `upcoming`: 4 soonest events from now forward
      operationId: getEventOverview
      responses:
        "200":
          description: Event overview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEventOverviewSuccessResponse"
        "500":
          description: Retrieval failure for past or upcoming events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/semester/{semester_id}:
    get:
      tags: [Events]
      summary: Get events for a semester code
      description: |
        `semester_id` format is generally `<S|A|F><yy>`, e.g. `S25`, `A26`, `F27`.
        If semester letter is invalid, implementation falls back to current semester.
      operationId: getSemesterEvents
      parameters:
        - name: semester_id
          in: path
          required: true
          description: Semester code (letter + two-digit year).
          schema:
            type: string
            minLength: 2
            example: S25
      responses:
        "200":
          description: Semester events found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSemesterSuccessResponse"
        "500":
          description: No events found or retrieval/processing failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      error:
                        type: string
                        example: Failed to retrieve semester data

  /images/{image_id}:
    get:
      tags: [Images]
      summary: Get image by id
      operationId: getImageById
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Image found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetImageSuccessResponse"
        "400":
          description: Invalid image id format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database query failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{id}:
    get:
      tags: [Members]
      summary: Get member by id
      operationId: getMemberById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Member found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMemberSuccessResponse"
        "400":
          description: Invalid member id format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database query failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{year}:
    get:
      tags: [Members]
      summary: Get members for school year suffix
      description: |
        Expects a two-digit year suffix (e.g. `25` for 2025).
        Current implementation validates year range and returns matching members.
      operationId: getMembersByYear
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 2
            pattern: "^[0-9]{2}$"
          example: "25"
      responses:
        "200":
          description: Members found for year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMembersSuccessResponse"
        "400":
          description: Invalid year format or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: No members found or DB failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: No members for year 25 found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    HealthSuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            state:
              type: string
              example: healthy
          required: [state]
      required: [data]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: member@example.com
        password:
          type: string
          example: super-secret-password

    LoginSuccessResponse:
      type: object
      properties:
        data:
          type: object
          required: [access_token, refresh_token]
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
      required: [data]

    RefreshSuccessResponse:
      type: object
      properties:
        data:
          type: object
          required: [access_token]
          properties:
            access_token:
              type: string
      required: [data]

    MemberAuthView:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          example: 67a1234ab89cd012ef345678
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string

    GetMeSuccessResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/MemberAuthView"
      required: [data]

    Event:
      type: object
      description: Generic event document representation as returned by serialization.
      required: [_id, title, date, location, type, blurb, published, created_at, updated_at, created_by, updated_by]
      properties:
        _id:
          type: string
          example: 67a1234ab89cd012ef345678
        title:
          type: string
        date:
          type: string
          format: date-time
        location:
          type: string
        type:
          type: string
        image_path:
          type: string
        blurb:
          type: string
        image_ids:
          type: array
          items:
            type: string
        published:
          type: boolean
        photographer_ids:
          type: array
          items:
            type: string
        creative_director_ids:
          type: array
          items:
            type: string
        model_ids:
          type: array
          items:
            type: string
        additional_personnel:
          type: array
          items:
            type: object
            properties:
              member_id:
                type: string
              role:
                type: string
        deleted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_by:
          type: string
        created_by:
          type: string
        updated_by:
          type: string

    Image:
      type: object
      description: Generic image document representation as returned by serialization.
      required: [_id, event_id, date, path, caption, published, width, height, photographer_id, creative_director_id, model_ids, created_at, updated_at, created_by, updated_by]
      properties:
        _id:
          type: string
          example: 67a1234ab89cd012ef345678
        event_id:
          type: string
        date:
          type: string
          format: date-time
        path:
          type: string
        caption:
          type: string
        published:
          type: boolean
        width:
          type: integer
        height:
          type: integer
        photographer_id:
          type: string
        creative_director_id:
          type: string
        model_ids:
          type: array
          items:
            type: string
        additional_personnel:
          type: array
          items:
            type: object
            properties:
              member_id:
                type: string
              role:
                type: string
        deleted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_by:
          type: string
        created_by:
          type: string
        updated_by:
          type: string

    Member:
      type: object
      description: Generic member document representation as returned by serialization.
      required: [_id, name, role, email, start_year, visibility, active, created_at, updated_at, created_by, updated_by]
      properties:
        _id:
          type: string
          example: 67a1234ab89cd012ef345678
        name:
          type: string
        display_name:
          type: string
        pronouns:
          type: string
        role:
          type: string
        email:
          type: string
          format: email
        links:
          type: object
          additionalProperties:
            type: string
        profile_photo_path:
          type: string
        blurb:
          type: string
        start_year:
          type: integer
        end_year:
          type: integer
        visibility:
          type: string
        active:
          type: boolean
        event_involvements:
          type: array
          items:
            type: string
        image_involvements:
          type: array
          items:
            type: string
        deleted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_by:
          type: string
        created_by:
          type: string
        updated_by:
          type: string

    GetEventSuccessResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Event"
      required: [data]

    GetImageSuccessResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Image"
      required: [data]

    GetMemberSuccessResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/MemberById"
      required: [data]

    PastEventCard:
      type: object
      properties:
        id:
          type: string
        _id:
          type: string
        title:
          type: string
        date:
          type: string
          format: date-time
        location:
          type: string
        type:
          type: string
        cover_image_path:
          type: string
        image_path:
          type: string

    GetPastEventsSuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            past_events:
              type: array
              items:
                $ref: "#/components/schemas/PastEventCard"
          required: [past_events]
      required: [data]

    GetEventOverviewSuccessResponse:
      type: object
      properties:
        data:
          type: object
          required: [upcoming, past]
          properties:
            upcoming:
              type: array
              items:
                $ref: "#/components/schemas/Event"
            past:
              type: array
              items:
                $ref: "#/components/schemas/Event"
      required: [data]

    GetSemesterSuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            semester_events:
              type: array
              items:
                $ref: "#/components/schemas/Event"
          required: [semester_events]
      required: [data]

    MemberListItem:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        role:
          type: string
        year:
          type: integer
        blurb:
          type: string
      required: [_id, name, role, year, blurb]

    GetMembersSuccessResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberListItem"
      required: [data]

    GetAdminImagesSuccessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [images, total, limit, skip]
          properties:
            images:
              type: array
              items:
                $ref: "#/components/schemas/Image"
            total:
              type: integer
              description: Total matching documents for the current query.
            limit:
              type: integer
              example: 50
            skip:
              type: integer
              example: 0
